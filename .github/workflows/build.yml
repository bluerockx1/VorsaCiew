name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:   # lets you trigger a build manually from your phone

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      # Overwrite placeholder google-services.json with real one from secret (when available)
      # The secret should contain the raw JSON content of google-services.json (no base64 needed)
      - name: Write google-services.json (from secret if set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PYEOF'
          import os, json
          content = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not content:
              print("GOOGLE_SERVICES_JSON secret not set — using placeholder")
          else:
              try:
                  data = json.loads(content)
                  with open("app/google-services.json", "w") as f:
                      json.dump(data, f, indent=2)
                  print("google-services.json written successfully from secret")
              except json.JSONDecodeError as e:
                  print(f"WARNING: GOOGLE_SERVICES_JSON secret contains malformed JSON: {e}")
                  print("Using placeholder — app will not connect to Firebase at runtime")
          PYEOF

      # Write the Maps API key into local.properties
      - name: Write local.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Upload the APK so you can download it from the Actions tab
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VorsaCiew-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
